<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="180" height="180" rx="40" ry="40" fill="url(#bg)"/>
  <!-- Glow behind Z -->
  <text x="90" y="120" font-family="system-ui, sans-serif" font-size="110" font-weight="900" text-anchor="middle" fill="url(#glow)" opacity="0.3" filter="url(#blur)">Z</text>
  <!-- Main Z letter -->
  <text x="90" y="120" font-family="system-ui, sans-serif" font-size="110" font-weight="900" text-anchor="middle" fill="url(#glow)">Z</text>
  <!-- Small sparkle dots -->
  <circle cx="140" cy="38" r="5" fill="#a78bfa" opacity="0.8"/>
  <circle cx="155" cy="55" r="3" fill="#818cf8" opacity="0.6"/>
  <circle cx="130" cy="52" r="2.5" fill="#c4b5fd" opacity="0.7"/>
</svg>
