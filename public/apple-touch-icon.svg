<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Atom/Brain icon (matching IconBrain) -->
  <g stroke="#7b61ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center dot -->
    <circle cx="16" cy="16" r="2" fill="#7b61ff" stroke="none"/>
    <!-- Three ellipses -->
    <ellipse cx="16" cy="16" rx="10" ry="4"/>
    <ellipse cx="16" cy="16" rx="10" ry="4" transform="rotate(60 16 16)"/>
    <ellipse cx="16" cy="16" rx="10" ry="4" transform="rotate(120 16 16)"/>
  </g>
</svg>
